<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
		<title>Omnitrix HUD</title>
		<link rel="stylesheet" href="./hud.css" />
	</head>
	<body>
		<div id="dim" hidden>
			<input id="command" aria-label="Question" placeholder="Question (optional), then drag a box · Esc cancels" />
			<div id="box" hidden></div>
			<input id="box-question" aria-label="Question" placeholder="Question (optional) · Enter" hidden />
		</div>
		<section id="panel" hidden>
			<button id="close" type="button" aria-label="Close">✕</button>
			<div id="transcript" aria-live="polite"></div>
			<input id="follow-up" aria-label="Follow-up question" placeholder="Follow-up · Enter" />
		</section>
		<script type="module" src="./hud.ts"></script>
	</body>
</html>
